<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2</title>
    <style>
        .produto {
            width: 200px; /* Largura fixa */
            border: 2px solid black; /* Borda visível */
            padding: 20px; /* Espaçamento interno */
            margin: 20px auto; /* Espaçamento externo e centralização */
        }

        .bloco1 { background-color: lightblue; }
        .bloco2 { background-color: lightgreen; }
        .bloco3 { background-color: lightcoral; }

        /* Diferença prática:
           A MARGIN é o espaço fora do elemento (afasta um bloco do outro).
           O PADDING é o espaço dentro do elemento (afasta o texto da borda).
           Ambos influenciam no layout pois aumentam o espaço total ocupado pelo bloco.
        */
    </style>
</head>
<body>
    <div class="produto bloco1">Produto 1</div>
    <div class="produto bloco2">Produto 2</div>
    <div class="produto bloco3">Produto 3</div>
</body>
</html>
