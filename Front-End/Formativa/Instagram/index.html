<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta @user_="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Instagram Clone - Sidebar Pronta</title>
    <style>
      /* --- Variáveis de Estilo --- */
      :root {
        --bg-color: #000000;
        --border-color: #262626;
        --text-primary: #f5f5f5;
        --text-secondary: #a8a8a8;
        --sidebar-width: 244px;
        --sidebar-narrow-width: 72px;
        --hover-overlay: rgba(255, 255, 255, 0.1);
        --placeholder-bg: #1a1a1a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        font-size: 14px;
      }

      /* --- Estrutura de Layout --- */
      .container-app {
        display: flex;
        min-height: 100vh;
      }

      /* Sidebar Principal */
      .barra-lateral {
        width: var(--sidebar-width);
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        padding: 8px 12px 20px;
        z-index: 100;
        background-color: var(--bg-color);
      }

      .barra-lateral > .container-logo {
        padding: 25px 12px 16px;
        margin-bottom: 19px;
        height: 73px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .barra-lateral .container-logo .logo-texto {
        fill: var(--text-primary);
        width: 103px;
        display: block;
      }

      .barra-lateral .container-logo .logo-icone {
        display: none;
        width: 24px;
        height: 24px;
        fill: var(--text-primary);
      }

      .barra-lateral .links-navegacao {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
        list-style: none;
      }

      .barra-lateral .item-navegacao {
        display: flex;
        align-items: center;
        padding: 12px;
        border-radius: 8px;
        transition: background-color 0.2s;
        cursor: pointer;
        color: var(--text-primary);
        text-decoration: none;
      }

      .barra-lateral .item-navegacao:hover {
        background-color: var(--hover-overlay);
      }

      .barra-lateral .item-navegacao > svg {
        width: 24px;
        height: 24px;
        margin-right: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }

      .barra-lateral .item-navegacao > span {
        font-size: 16px;
      }

      .barra-lateral .item-navegacao.ativo {
        font-weight: 700;
      }

      .barra-lateral .item-navegacao > .foto-perfil {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        margin-right: 16px;
        background-color: #f0f0f0;
        object-fit: cover;
      }

      /* --- Conteúdo Central (Main) --- */
      .conteudo-principal {
        margin-left: var(--sidebar-width);
        flex-grow: 1;
        display: flex;
        justify-content: center;
        padding-top: 20px;
      }

      .container-feed {
        max-width: 470px;
        width: 100%;
        margin-right: 64px;
      }

      .barra-sugestoes {
        width: 319px;
        margin-top: 20px;
      }

      /* --- Placeholders para Treino no Feed --- */
      .secao-placeholder,
      .secao-post,
      .secao-storys {
        /* border: 1px dashed #444; */
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .secao-placeholder {
        background: var(--placeholder-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
      }

      .icon-filled {
        fill: currentColor;
        stroke-width: 0;
      }

      .secao-post {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 60px auto 45px;
        overflow: hidden;
        padding: 0px;
      }

      .secao-post > .post-name > img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
      }

      .secao-post .post-name {
        display: flex;
        align-items: center;
        color: white;
        padding: 0 15px;
        gap: 10px;
      }

      .post-img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
      }

      .secao-storys {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .story-card {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      .story-div {
        height: 60px;
        width: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background:
          linear-gradient(#121212, #121212) padding-box,
          linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888)
            border-box;
        border: 3px solid transparent;
      }

      .story-card > p {
        font-size: 12px;
      }

      .story-img {
        height: 50px;
        width: 50px;
        border-radius: 50%;
        object-fit: cover;
      }

      .post-info {
        display: grid;
        grid-template-columns: 5fr 1fr;
        grid-template-rows: 1fr;
      }

      .post-info .icons-info {
        display: flex;
        align-items: center;
        justify-content: left;
        padding-left: 15px;
        gap: 16px;
      }

      .post-info .icon-save {
        display: flex;
        align-items: center;
        justify-content: right;
        padding-right: 15px;
      }

      /* --- Responsividade --- */
      @media (max-width: 1264px) {
        .barra-lateral {
          width: var(--sidebar-narrow-width);
          align-items: center;
        }
        .barra-lateral .container-logo .logo-texto {
          display: none;
        }
        .barra-lateral .container-logo .logo-icone {
          display: block;
        }
        .barra-lateral .item-navegacao > span {
          display: none;
        }
        .barra-lateral .item-navegacao > svg,
        .barra-lateral .item-navegacao > .foto-perfil {
          margin-right: 0;
        }
        .conteudo-principal {
          margin-left: var(--sidebar-narrow-width);
        }
      }

      @media (max-width: 1160px) {
        .barra-sugestoes {
          display: none;
        }
        .container-feed {
          margin-right: 0;
        }
      }

      @media (max-width: 768px) {
        .barra-lateral {
          width: 100%;
          height: 50px;
          position: fixed;
          bottom: 0;
          top: auto;
          flex-direction: row;
          border-right: none;
          border-top: 1px solid var(--border-color);
          padding: 0;
          justify-content: space-around;
        }
        .barra-lateral > .container-logo,
        .barra-lateral .links-navegacao > .item-navegacao:nth-child(4),
        .barra-lateral .links-navegacao > .item-navegacao:nth-child(6),
        .barra-lateral .links-navegacao > .item-navegacao:nth-child(10),
        .barra-lateral .links-navegacao > .item-navegacao:nth-child(11) {
          display: none;
        }
        .barra-lateral .links-navegacao {
          flex-direction: row;
          width: 100%;
          justify-content: space-around;
        }
        .conteudo-principal {
          margin-left: 0;
          padding-bottom: 60px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container-app">
      <!-- SIDEBAR: Navegação Pronta -->

        <div class="container-logo">

          <div class="item-navegacao">

          <div class="item-navegacao">

          <div class="item-navegacao" style="margin-top: auto">

          <div class="item-navegacao">

        </div>
      </nav>
